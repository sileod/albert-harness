name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile bin/albert bin/albert-spawn bin/nim bin/nim-spawn
      - run: bash -n install.sh
      - run: ALBERT_API_KEY=test python bin/albert-spawn matrix >/dev/null
      - run: NVIDIA_API_KEY=test python bin/nim-spawn matrix >/dev/null
